# LUMI Voice Assistant — Default Configuration
# Copy to config/user.yaml to override settings

# Audio Input
audio_input:
  device_index: null  # null = system default
  sample_rate: 16000
  channels: 1
  chunk_duration_ms: 100
  dtype: float32

# Audio Output
audio_output:
  device_index: null  # null = system default
  sample_rate: 22050
  channels: 1

# Voice Activity Detection
vad:
  energy_threshold: 0.01
  silence_duration_s: 1.5
  min_speech_duration_s: 0.3
  pre_speech_padding_s: 0.3

# Speech-to-Text (Whisper via faster-whisper)
stt:
  model_size: "tiny"  # tiny, base, small, medium, large-v3
  device: "cpu"       # cpu or cuda
  compute_type: "int8" # int8, float16, float32
  language: "en"
  beam_size: 5
  vad_filter: true
  min_transcript_length: 2

# Language Model (Ollama)
llm:
  backend: "ollama"   # ollama (default)
  ollama:
    host: "http://localhost:11434"
    model: "phi3:latest"
    timeout_s: 60
    stream: true
  conversation:
    max_history: 20
    system_prompt: |
      You are LUMI, a friendly, warm, and patient healthcare companion robot.
      You assist elderly users and people who need care.
      Keep your spoken responses concise — typically 1-3 sentences.
      Be helpful, kind, and conversational. Ask clarifying questions when needed.
      Be honest about your limitations. Never diagnose medical conditions.
      Never invent medication schedules or medical advice.
      Never present yourself as a substitute for professional medical care.
      If someone describes a medical emergency, urge them to call emergency services immediately.
      For non-conversation requests (like "come here" or "find John"),
      respond conversationally but note that the physical capability is not yet connected.

# Text-to-Speech (Piper)
tts:
  voice_model: "en_US-lessac-medium"  # Piper voice model name
  voice_model_path: "voices/en_US-lessac-medium.onnx"
  speaker_id: null
  length_scale: 1.0  # Speed: <1.0 = faster, >1.0 = slower
  sentence_silence_s: 0.3

# Interaction Mode
interaction:
  mode: "push_to_talk"  # push_to_talk or continuous
  wake_word: null  # Optional: e.g., "hey lumi" (requires openwakeword)

# Privacy & Logging
privacy:
  save_conversation_history: false
  save_audio_recordings: false
  log_transcripts: false
  conversation_history_path: "logs/conversations"

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: null  # Optional log file path

# ROS 2 Bridge (optional)
ros2:
  enabled: false
  namespace: "/lumi"
  topics:
    recognized_speech: "recognized_speech"
    response_text: "response_text"
    status: "voice_status"
    command: "voice_command"
